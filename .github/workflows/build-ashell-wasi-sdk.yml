name: Build and release a-Shell WASI SDK

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: a-Shell WASI SDK tag or commit
        required: true
        default: wasi-sdk-aShell-22
      release_tag:
        description: GitHub Release tag to create or update
        required: true
        default: ashell-wasi-sdk-22
  push:
    tags:
      - 'ashell-wasi-sdk-*'

permissions:
  contents: write

env:
  SDK_REPOSITORY: https://github.com/holzschu/wasi-sdk.git
  SDK_REF: ${{ inputs.sdk_ref || 'wasi-sdk-aShell-22' }}
  EXPECTED_SDK_COMMIT: 3d2154daab00d4479d855a661355566b2e393702
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-release:
    name: Build Linux a-Shell WASI SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake git ninja-build python3 tar gzip xz-utils

      - name: Check out a-Shell WASI SDK source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --recurse-submodules --shallow-submodules \
            --depth 1 --branch "$SDK_REF" "$SDK_REPOSITORY" "$RUNNER_TEMP/wasi-sdk-source"
          actual=$(git -C "$RUNNER_TEMP/wasi-sdk-source" rev-parse HEAD)
          if [ "$SDK_REF" = 'wasi-sdk-aShell-22' ] && [ "$actual" != "$EXPECTED_SDK_COMMIT" ]; then
            echo "Unexpected a-Shell SDK commit: $actual" >&2
            exit 1
          fi
          printf 'SDK_REF=%s\nSDK_COMMIT=%s\n' "$SDK_REF" "$actual" \
            > "$RUNNER_TEMP/wasi-sdk-source/SOURCES"

      - name: Build and install SDK
        shell: bash
        run: |
          set -euo pipefail
          export PREFIX="$RUNNER_TEMP/wasi-sdk-install"
          env PREFIX="$PREFIX" make -C "$RUNNER_TEMP/wasi-sdk-source" -j"$(nproc)"
          test -x "$PREFIX/bin/clang"
          test -f "$PREFIX/share/wasi-sysroot/include/__wasi__" || \
            test -d "$PREFIX/share/wasi-sysroot/include"

      - name: Verify target compiler and sysroot
        shell: bash
        run: |
          set -euo pipefail
          export PREFIX="$RUNNER_TEMP/wasi-sdk-install"
          "$PREFIX/bin/clang" --version
          "$PREFIX/bin/clang" --target=wasm32-wasi --print-resource-dir
          "$PREFIX/bin/clang" --target=wasm32-wasi \
            --sysroot="$PREFIX/share/wasi-sysroot" -x c -c /dev/null -o "$RUNNER_TEMP/probe.o"
          file "$RUNNER_TEMP/probe.o"
          test "$(file -b "$RUNNER_TEMP/probe.o")" = *WebAssembly*

      - name: Package SDK toolchain
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export PREFIX="$RUNNER_TEMP/wasi-sdk-install"
          archive="$RUNNER_TEMP/wasi-sdk-aShell-linux-x86_64.tar.gz"
          tar -C "$PREFIX" --sort=name --mtime='UTC 1970-01-01' \
            -czf "$archive" .
          sha256sum "$archive" | tee "$archive.sha256"
          printf 'archive=%s\nchecksum=%s\n' "$archive" "$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasi-sdk-aShell-linux-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          archive="${{ steps.package.outputs.archive }}"
          checksum="${{ steps.package.outputs.checksum }}"
          notes=$(printf '%s\n\n%s\n%s\n' \
            'Linux x86_64 a-Shell WASI SDK toolchain.' \
            "Source: $SDK_REPOSITORY" \
            "Ref: $SDK_REF")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$checksum" --clobber
          else
            gh release create "$tag" "$archive" "$checksum" \
              --title "$tag" --notes "$notes"
          fi
