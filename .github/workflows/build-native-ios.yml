name: Build native iOS artifacts

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release after a successful build
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag; leave empty to use ios-<short-sha>-<run-number>
        required: false
        default: ''
        type: string
  push:
    branches: [default]

permissions:
  contents: write

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  JOBS: '16'
  IPHONEOS_DEPLOYMENT_TARGET: '13.0'
  IOS_SDK_VERSION: '16.5'
  HERMES_REFRESH_VENDOR: '1'
  CPYTHON_REF: 'v3.13.9'
  OPENSSL_REF: 'openssl-3.3.2'
  HERMES_AGENT_COMMIT: '2246c245f51e03eb6a151d19119009156e84659a'
  HERMES_WEBUI_COMMIT: 'e36f77389191fe9d81cd3a7416772e2f7b022e19'

jobs:
  build-native-ios:
    name: Build native iOS artifacts (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          curl --fail --location --retry 3 --retry-all-errors https://apt.llvm.org/llvm.sh \
            --output "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang-22 curl git lld-22 llvm-22 make perl \
            libbz2-dev libffi-dev libgdbm-dev liblzma-dev libncurses-dev \
            libreadline-dev libsqlite3-dev libssl-dev pkg-config unzip uuid-dev zlib1g-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          /usr/lib/llvm-22/bin/clang --version
          /usr/lib/llvm-22/bin/llvm-ar --version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build runtime and native Hermes on Linux
        env:
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/native-ios
        run: |
          set -euo pipefail
          bash build/build-hermesrt.sh hermesrt.zip
          bash build/build-native-hermes.sh

      - name: Validate native Hermes and runtime
        run: |
          set -euo pipefail
          test -x hermes
          test -s hermesrt.zip
          file hermes
          unzip -t hermesrt.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('hermesrt.zip') as archive:
              names = set(archive.namelist())
              required = {
                  'hermes/hermes_cli/main.py',
                  'hermes/hermes_cli/upgrade.py',
                  'hermes-webui/api/config.py',
                  'python/encodings/__init__.py',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'missing runtime entries: {missing}')
              bad = sorted(n for n in names if n.endswith(('.so', '.dylib', '.pyd', '.wasm')))
              if bad:
                  raise SystemExit(f'forbidden native entries: {bad[:10]}')
              if any('/.git/' in f'/{n}' for n in names):
                  raise SystemExit('embedded .git entries are not allowed')
          PY
          sha256sum hermes hermesrt.zip

      - name: Upload Hermes executable
        uses: actions/upload-artifact@v4
        with:
          name: hermes-native-ios
          path: hermes
          if-no-files-found: error
          retention-days: 30

      - name: Upload hermesrt.zip
        uses: actions/upload-artifact@v4
        with:
          name: hermesrt-native-ios
          path: hermesrt.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create requested release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          if [ -z "$tag" ]; then tag="ios-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$tag" hermes hermesrt.zip \
            --title "Hermes native iOS $tag" --generate-notes
