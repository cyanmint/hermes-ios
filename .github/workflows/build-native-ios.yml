name: Build native iOS artifacts

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release after a successful build
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag; leave empty to use ios-<short-sha>-<run-number>
        required: false
        default: ''
        type: string
  push:
    branches:
      - default

permissions:
  contents: write

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      JOBS: '16'
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
      IOS_SDK_VERSION: '16.5'
      BUILD_ROOT: /home/runner/hermes-build/native-ios
      HERMES_REFRESH_VENDOR: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm pkg-config libsqlite3-dev zlib1g-dev \
            ca-certificates curl git unzip

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build Hermes native iOS artifacts
        run: |
          set -euo pipefail
          JOBS=16 bash build/build-native-ios.sh

      - name: Validate the two deliverables
        shell: bash
        run: |
          set -euo pipefail
          test -x hermes
          test -s hermesrt.zip
          file hermes hermesrt.zip
          unzip -t hermesrt.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path('hermesrt.zip')
          with zipfile.ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              required = {
                  'hermes/hermes_cli/main.py',
                  'hermes/hermes_cli/upgrade.py',
                  'hermes-webui/api/config.py',
                  'overlay/patches/patch-ios-stability.py',
                  'python/encodings/__init__.py',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'missing runtime entries: {missing}')
              forbidden = tuple('.so' for _ in [0]) + ('.dylib', '.pyd', '.wasm')
              bad_native = sorted(n for n in names if n.endswith(forbidden))
              if bad_native:
                  raise SystemExit(f'forbidden native entries: {bad_native[:10]}')
              embedded_git = sorted(n for n in names if '/.git/' in f'/{n}')
              if embedded_git:
                  raise SystemExit(f'embedded .git entries are not allowed: {embedded_git[:5]}')
              if bundle.testzip() is not None:
                  raise SystemExit('runtime ZIP integrity check failed')
          PY
          sha256sum hermes hermesrt.zip

      - name: Upload Hermes executable
        uses: actions/upload-artifact@v4
        with:
          name: hermes-native-ios
          path: hermes
          if-no-files-found: error
          retention-days: 30

      - name: Upload Hermes runtime ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hermesrt-native-ios
          path: hermesrt.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create release when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          if [ -z "$tag" ]; then
            tag="ios-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" hermes hermesrt.zip \
            --title "Hermes native iOS $tag" \
            --generate-notes
