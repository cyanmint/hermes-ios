name: Build Ubuntu WASI runtime

on:
  push:
    paths:
      - '.github/workflows/build-cpython-wasi.yml'
      - 'build/**'
      - 'overlay/**'
      - 'loader.py'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      cpython_ref:
        description: CPython tag or commit
        required: true
        default: v3.13.9
      publish_release:
        description: Create a GitHub release with the three delivery files
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (required when publishing)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CPYTHON_REF: ${{ inputs.cpython_ref || 'v3.13.9' }}
      WASI_SDK_VERSION: '24.0'
      WASMTIME_VERSION: '48.0.2'
      HERMES_AGENT_COMMIT: '2246c245f51e03eb6a151d19119009156e84659a'
      HERMES_WEBUI_COMMIT: 'e36f77389191fe9d81cd3a7416772e2f7b022e19'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Ubuntu build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake build-essential bzip2 curl file git \
            libbz2-dev libffi-dev liblzma-dev libncurses5-dev \
            libreadline-dev libsqlite3-dev libssl-dev libxml2-dev \
            libxmlsec1-dev pkg-config tar tk-dev unzip xz-utils zlib1g-dev

      - name: Install host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-wasip1
          components: rust-src

      - name: Download standard WASI SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/${archive}"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "$RUNNER_TEMP/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux/bin" >> "$GITHUB_PATH"

      - name: Install standard Wasmtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
            -o "$RUNNER_TEMP/wasmtime.tar.xz"
          mkdir -p "$RUNNER_TEMP/wasmtime"
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/wasmtime"
          echo "$RUNNER_TEMP/wasmtime" >> "$GITHUB_PATH"
          wasmtime --version

      - name: Build from scratch and package delivery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /root/hermes-build build/external hermes.wasm hermesrt.zip
          bash build/build-ubuntu-wasi.sh

      - name: Verify the three delivery files
        shell: bash
        run: |
          set -euo pipefail
          test -s loader.py
          test -s hermes.wasm
          test -s hermesrt.zip
          HERMES_WASM_COMMAND=wasmtime timeout 30 python3 loader.py sockettest --verbose
          sha256sum loader.py hermes.wasm hermesrt.zip

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ubuntu-wasi-${{ github.sha }}
          if-no-files-found: error
          path: |
            loader.py
            hermes.wasm
            hermesrt.zip

      - name: Publish optional release
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || format('hermes-{0}-{1}', github.ref_name, github.run_number) }}
          name: Hermes Ubuntu WASI ${{ inputs.release_tag || github.run_number }}
          generate_release_notes: true
          files: |
            loader.py
            hermes.wasm
            hermesrt.zip
